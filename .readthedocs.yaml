version: 2
build:
  os: ubuntu-24.04
  jobs:
    pre_build:
      - python scripts/vendor_assets.py
    post_build:
      - python scripts/build_tutorials.py "$READTHEDOCS_OUTPUT/html"
  tools:
    python: "3.12"
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
python:
  install:
    - requirements: requirements-docs.txt
