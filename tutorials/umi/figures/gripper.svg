<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" role="img" aria-labelledby="title desc">
  <title id="title">手持 UMI 的测量部位</title>
  <desc id="desc">俯视概念图。腕部相机朝向两根平行夹指。指上标记用于估计开度，两指之间定义工具中心点。</desc>
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#d9e5e7" stroke-width=".8"/></pattern>
    <g id="tag"><rect width="18" height="18" rx="1" fill="#f9fbf4"/><path d="M2 2h14v14H2z" fill="#243c46"/><path d="M5 5h4v4H5zm5 4h3v4h-3z" fill="#fff"/></g>
  </defs>
  <rect width="760" height="322" rx="12" fill="#f0f6f5"/><rect width="760" height="322" rx="12" fill="url(#grid)"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M320 158 L608 55V264Z" fill="#c1e5dd" fill-opacity=".74" stroke="#589e96" stroke-dasharray="5 5"/>
    <path d="M80 141h112v40H80q-23-20 0-40Z" fill="#75909b" stroke="#243c46" stroke-width="3"/>
    <rect x="179" y="121" width="119" height="80" rx="16" fill="#4b6976" stroke="#233a46" stroke-width="3"/>
    <rect x="282" y="83" width="44" height="156" rx="8" fill="#8ba8b2" stroke="#233a46" stroke-width="3"/>
    <path d="M306 90h182l22 14v17h-50l-12-8H306zm0 144h182l22-14v-17h-50l-12 8H306z" fill="#d6a567" stroke="#704e30" stroke-width="3"/>
    <rect x="254" y="136" width="80" height="47" rx="7" fill="#263d4c"/>
    <path d="M331 143h12v33h-12z" fill="#427e81" stroke="#1c383e" stroke-width="2"/>
    <use href="#tag" x="453" y="93"/><use href="#tag" x="453" y="210"/>
    <path d="M490 125v28m0 15v31m-4-68 4-7 4 7m-8 62 4 7 4-7" fill="none" stroke="#8d5828" stroke-width="2"/>
    <circle cx="490" cy="162" r="6" fill="#a34929" stroke="white" stroke-width="2"/>
    <path d="M190 62h57l31 73M579 58h-75l-41 43M559 157l-62 5M584 253h-53l-34-55" stroke="#344f59" stroke-width="1.5" fill="none"/>
  </g>
  <g fill="#203b45" font-family="sans-serif" font-size="18" font-weight="600">
    <text x="58" y="68">腕部相机与 IMU</text><text x="587" y="65">夹指视觉标记</text>
    <text x="564" y="162">工具中心点 TCP</text><text x="592" y="259">夹爪开度 w</text>
  </g>
  <text x="26" y="299" fill="#50676d" font-family="sans-serif" font-size="15">俯视示意　／　浅绿色表示相机朝向夹指的视野</text>
</svg>
